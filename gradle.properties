# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
android.nonTransitiveRClass=true
android.useAndroidX=true
# 允许项目路径包含非 ASCII 字符（本机路径为中文目录，仅本地构建用）
android.overridePathCheck=true
kotlin.code.style=official
org.gradle.configureondemand=false
org.gradle.daemon=true
org.gradle.daemon.idletimeout=10800000
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=false
systemProp.file.encoding=UTF-8
systemProp.sun.jnu.encoding=UTF-8
systemProp.user.country=US
systemProp.user.language=en
org.gradle.caching=true
android.aapt2.process.daemon=false

org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
kotlin.compiler.execution.strategy=in-process


# Proot 环境：aapt2 只能用 aarch64 原生二进制（Maven 的 linux-aarch64 分类器不存在，
# 会报 Daemon startup failed）。指向 build-tools 里同版本的 aarch64 aapt2。
android.aapt2FromMavenOverride=/root/Android/build-tools/35.0.0/aapt2
