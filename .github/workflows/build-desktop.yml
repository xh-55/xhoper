# XhOper 桌面版 · GitHub Actions 构建
#
# jpackage 不能跨平台——要 Windows 的 .exe，就必须在 Windows 上打包。
# 这里借 GitHub 的 windows-latest 机器出包，产物上传为 Artifact。
#
# 注意：Windows runner 上必须用 gradlew.bat。写 ./gradlew 时 PowerShell 会
# 把它当成无效可执行文件，命令"成功"但没有实际运行（日志里只有回显），
# 于是 exe 不会生成，而步骤却显示绿色——非常容易误判。
name: Build Desktop (Windows)

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - 'desktop/**'
      - 'app/src/main/kotlin/com/yunx/app/data/network/**'
      - 'app/src/main/kotlin/com/yunx/app/data/security/**'
      - '.github/workflows/build-desktop.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-desktop-${{ hashFiles('desktop/**/*.gradle*', 'desktop/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-desktop-

      # 先单独编译：这一步失败通常是源码/垫片对不上，
      # 拆出来可以让错误在日志里更早、更清楚（打包阶段会吞掉编译输出）。
      - name: Compile Kotlin
        run: .\gradlew.bat compileKotlin --no-daemon --stacktrace

      # 打包 exe + msi（jpackage 在本机 Windows 上运行）
      - name: Package EXE
        run: .\gradlew.bat packageReleaseExe --no-daemon --stacktrace

      # 产物路径由 Compose Desktop 约定：
      #   desktop/build/compose/binaries/main/exe/
      # 显式断言「文件真的存在」，避免 upload-artifact 的 warn 把空产物吞掉。
      - name: Verify EXE exists
        run: |
          $exe = Get-ChildItem -Recurse build/compose/binaries/main/exe -Filter *.exe -ErrorAction SilentlyContinue
          if (-not $exe) {
            Write-Error "没有生成 exe，查看上面的 Gradle 输出"
            exit 1
          }
          $exe | ForEach-Object { Write-Host "$($_.FullName)  $([math]::Round($_.Length/1MB,1)) MB" }

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: XhOper-Desktop-Windows
          path: |
            desktop/build/compose/binaries/main/exe/*.exe
            desktop/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            desktop/build/reports/**
            desktop/build/tmp/**
          if-no-files-found: ignore