# XhOper 桌面版 · GitHub Actions 构建
#
# 为什么要有这个文件：
#   jpackage 不能跨平台——要 Windows 的 .exe，就必须在 Windows 上打包。
#   这里借 GitHub 的 windows-latest 机器出包，产物上传为 Artifact，
#   从 Actions 页面下载即可，本地不需要任何 Windows 环境。
#
# 触发：
#   - 手动（Actions → Build Desktop (Windows) → Run workflow）
#   - 推送到 main/master 且改动了 desktop/ 或解析层源码
name: Build Desktop (Windows)

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - 'desktop/**'
      - 'app/src/main/kotlin/com/yunx/app/data/network/**'
      - 'app/src/main/kotlin/com/yunx/app/data/security/**'
      - '.github/workflows/build-desktop.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-desktop-${{ hashFiles('desktop/**/*.gradle*', 'desktop/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-desktop-

      # 先只编译。这一步失败通常是源码/垫片对不上，
      # 单独拆出来可以让错误在日志里更早、更清楚（打包阶段会吞掉编译输出）。
      - name: Compile Kotlin
        run: ./gradlew compileKotlin --no-daemon --stacktrace

      # 打包成 exe + msi（jpackage 在本机 Windows 上运行）
      - name: Package EXE
        run: ./gradlew packageReleaseExe --no-daemon --stacktrace

      - name: List artifacts
        if: always()
        run: |
          if (Test-Path build/compose/binaries/main) {
            Get-ChildItem -Recurse build/compose/binaries/main | Select-Object FullName, Length
          } else {
            Write-Host "not generated"
          }
        shell: pwsh

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: XhOper-Desktop-Windows
          path: |
            desktop/build/compose/binaries/main/exe/*.exe
            desktop/build/compose/binaries/main/msi/*.msi
          if-no-files-found: warn

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            desktop/build/reports/**
            desktop/build/tmp/**
          if-no-files-found: ignore