# XhOper 自建服务（nginx 片段）
#
# 放到 /etc/nginx/conf.d/xhoper.conf，然后把 server/ 目录整体传到 /var/www/xhoper/。
# 目录结构要求：
#   /var/www/xhoper/api/v1/app/latest     ← 更新清单（无扩展名，靠 default_type 声明 json）
#   /var/www/xhoper/api/v1/announcements  ← 公告列表（空列表即可，App 内已无启动弹窗）
#   /var/www/xhoper/apk/XhOper-x.y.apk    ← 更新包

server {
    listen 80;
    server_name 43.128.136.224;

    root /var/www/xhoper;
    charset utf-8;

    # 更新清单与公告：无扩展名文件必须声明成 JSON，否则 App 端会当成文本
    location /api/ {
        default_type application/json;
        # 清单要实时生效，禁止任何缓存
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    # 更新包：大文件，关掉 gzip，允许断点续传
    location /apk/ {
        default_type application/vnd.android.package-archive;
        gzip off;
        add_header Accept-Ranges bytes;
        try_files $uri =404;
    }

    # 其余路径一律不给（本机只做更新分发，不挂站点）
    location / {
        return 404;
    }
}